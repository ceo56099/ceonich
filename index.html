
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PT Nyawit Bareng | Leadership</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#17131d;
  background:#fff;
}
.hero{
  position:relative;
  min-height:720px;
  overflow:hidden;
  padding:45px 5%;
}
.purple-shape{
  position:absolute;
  top:-100px;
  right:-110px;
  width:300px;
  height:520px;
  background:linear-gradient(135deg,#b85bff,#7600d9);
  transform:rotate(-38deg);
}
.logo{
  position:relative;
  z-index:2;
  font-size:21px;
  font-weight:900;
  line-height:1.2;
}
.logo span{color:#8700df}
.intro{
  position:relative;
  z-index:2;
  margin-top:330px;
  max-width:490px;
}
.intro h1{
  font-size:clamp(35px,5vw,60px);
  line-height:1.08;
  margin:0 0 20px;
}
.intro p{
  font-size:18px;
  line-height:1.7;
  color:#555;
}
.person{
  position:absolute;
  z-index:1;
  width:42%;
  height:390px;
  object-fit:cover;
  filter:grayscale(100%);
  clip-path:polygon(20% 0,100% 0,100% 75%,50% 100%,0 45%);
}
.ceo{top:0;left:38%}
.director{
  top:365px;
  right:5%;
  height:330px;
  clip-path:polygon(50% 0,100% 55%,50% 100%,0 55%);
}
.tag{
  position:absolute;
  z-index:3;
  background:linear-gradient(100deg,#bd5bff,#7900df);
  color:white;
  padding:13px 30px;
  font-weight:bold;
  font-size:23px;
  transform:skew(-8deg);
}
.tag-ceo{top:235px;left:34%}
.tag-director{top:480px;right:4%}
.name{
  position:absolute;
  z-index:3;
  font-weight:bold;
  background:#fff;
  padding:7px;
}
.name-ceo{top:290px;left:39%}
.name-director{top:445px;right:14%}
.footer{
  background:#17131d;
  color:white;
  padding:25px 5%;
  text-align:center;
  line-height:1.7;
}
@media(max-width:650px){
  .hero{padding:28px 6%;min-height:900px}
  .logo{font-size:18px}
  .purple-shape{width:150px;right:-80px}
  .ceo{top:100px;left:32%;width:64%;height:280px}
  .tag-ceo{top:265px;left:7%;font-size:18px}
  .name-ceo{top:315px;left:10%}
  .intro{margin-top:405px}
  .intro h1{font-size:37px}
  .intro p{font-size:16px}
  .director{top:625px;right:4%;width:58%;height:220px}
  .tag-director{top:720px;right:4%;font-size:17px}
  .name-director{top:680px;right:22%}
  .footer{font-size:13px}
}
</style>
</head>
<body>
<section class="hero">
  <div class="purple-shape"></div>

  <div class="logo">
    <span>●</span> PT NYAWIT BARENG
  </div>

  <img class="person ceo" src="ceo.jpg"
       alt="Foto CEO Ansori">

  <div class="tag tag-ceo">CEO</div>
  <div class="name name-ceo">Ansori</div>

  <div class="intro">
    <h1>Meet Our CEO<br>and Founder</h1>
    <p>
      Mengenal pemimpin PT Nyawit Bareng,
      visi perusahaan, serta komitmen untuk
      tumbuh dan berkembang bersama.
    </p>
  </div>

  <img class="person director" src="direktur.jpg"
       alt="Foto Direktur Thomas Alex">

  <div class="name name-director">Thomas Alex</div>
  <div class="tag tag-director">DIRECTOR</div>
</section>

<footer class="footer">
  <strong>PT NYAWIT BARENG</strong><br>
  Bersama Bertumbuh, Bersama Membangun Masa Depan.
</footer>
</body>
</html>
